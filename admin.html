<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - GiziPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'login.html';
        tailwind.config = { theme: { extend: { colors: { utama: '#10b981', gelap: '#0f172a', terang: '#f8fafc' } } } }
    </script>
</head>
<body class="bg-terang font-sans flex h-screen overflow-hidden text-slate-800">
    
    <!-- Sidebar -->
    <aside class="w-72 bg-gelap text-white flex flex-col shadow-2xl z-20">
        <div class="h-20 flex items-center px-8 border-b border-white/10">
            <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-utama to-emerald-400">GiziPro <span class="text-xs text-slate-400 align-top">Panel</span></h1>
        </div>
        <nav class="flex-1 overflow-y-auto py-6">
            <ul class="space-y-1 px-4" id="menuList">
                <li><button onclick="switchTab('dashboard')" id="btn-dashboard" class="w-full text-left px-5 py-3.5 bg-utama/20 text-utama rounded-xl font-bold transition menu-btn">📊 Ringkasan</button></li>
                <li><button onclick="switchTab('pengguna')" id="btn-pengguna" class="w-full text-left px-5 py-3.5 hover:bg-white/5 rounded-xl text-slate-400 hover:text-white transition font-medium menu-btn">👥 Database Pengguna</button></li>
                <li><button onclick="switchTab('resep')" id="btn-resep" class="w-full text-left px-5 py-3.5 hover:bg-white/5 rounded-xl text-slate-400 hover:text-white transition font-medium menu-btn">🥗 Data Resep</button></li>
            </ul>
        </nav>
        <div class="p-6 border-t border-white/10">
            <button onclick="handleLogout()" class="w-full py-3 bg-red-500/10 text-red-500 rounded-xl font-bold hover:bg-red-500 hover:text-white transition">🚪 Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen">
        <header class="h-20 bg-white/80 backdrop-blur-md shadow-sm flex items-center justify-between px-10 border-b border-slate-100 z-10">
            <h2 id="pageTitle" class="text-2xl font-bold text-gelap tracking-tight">Ringkasan Sistem</h2>
            <div class="flex items-center gap-3">
                <span class="text-sm font-bold text-slate-500">Syawal Maulana</span>
                <div class="w-10 h-10 bg-gradient-to-br from-utama to-emerald-700 text-white rounded-full flex items-center justify-center font-bold shadow-md">SM</div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-10">
            
            <!-- Tab 1: Dashboard -->
            <div id="content-dashboard" class="content-section">
                <div class="grid grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center">
                        <span class="text-slate-400 text-sm font-bold uppercase">Total Pengguna</span>
                        <span id="stat-pengguna" class="text-4xl font-black text-gelap mt-2">0</span>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center">
                        <span class="text-slate-400 text-sm font-bold uppercase">Total Resep Aktif</span>
                        <span id="stat-resep" class="text-4xl font-black text-gelap mt-2">0</span>
                    </div>
                </div>
            </div>

            <!-- Tab 2: Pengguna (CRUD Database Simulasi) -->
            <div id="content-pengguna" class="content-section hidden">
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold">Data Pengguna</h3>
                        <form onsubmit="addUser(event)" class="flex gap-2">
                            <input type="text" id="newUserName" placeholder="Nama User Baru" class="px-4 py-2 border rounded-lg bg-slate-50" required>
                            <button type="submit" class="bg-gelap text-white px-4 py-2 rounded-lg font-bold hover:bg-utama transition">+ Tambah</button>
                        </form>
                    </div>
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="text-slate-400 text-sm border-b"><th class="py-3">ID</th><th>Nama</th><th>Aksi</th></tr></thead>
                        <tbody id="userTableBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- Tab 3: Resep (CRUD Database Simulasi) -->
            <div id="content-resep" class="content-section hidden">
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold">Data Resep Diet</h3>
                        <form onsubmit="addRecipe(event)" class="flex gap-2">
                            <input type="text" id="newRecipeName" placeholder="Nama Menu Resep" class="px-4 py-2 border rounded-lg bg-slate-50" required>
                            <button type="submit" class="bg-utama text-white px-4 py-2 rounded-lg font-bold hover:bg-emerald-700 transition">+ Tambah</button>
                        </form>
                    </div>
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="text-slate-400 text-sm border-b"><th class="py-3">Menu Resep</th><th>Aksi</th></tr></thead>
                        <tbody id="recipeTableBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- LOGIKA SIMULASI DATABASE MENGGUNAKAN LOCAL STORAGE ---
        
        // Inisialisasi Data Kosong jika belum ada
        if(!localStorage.getItem('db_users')) localStorage.setItem('db_users', JSON.stringify([{id: 1, name: 'Budi Santoso'}]));
        if(!localStorage.getItem('db_recipes')) localStorage.setItem('db_recipes', JSON.stringify(['Salad Dada Ayam', 'Smoothie Bayam']));

        // Fungsi Render Data ke Tabel
        function renderData() {
            const users = JSON.parse(localStorage.getItem('db_users'));
            const recipes = JSON.parse(localStorage.getItem('db_recipes'));
            
            // Update Statistik Dashboard
            document.getElementById('stat-pengguna').innerText = users.length;
            document.getElementById('stat-resep').innerText = recipes.length;

            // Render Tabel Pengguna
            document.getElementById('userTableBody').innerHTML = users.map((u, i) => `
                <tr class="hover:bg-slate-50"><td class="py-4 font-medium text-slate-500">#USR-${u.id}</td><td class="font-bold">${u.name}</td>
                <td><button onclick="deleteUser(${i})" class="text-red-500 hover:bg-red-50 px-3 py-1 rounded">Hapus</button></td></tr>
            `).join('');

            // Render Tabel Resep
            document.getElementById('recipeTableBody').innerHTML = recipes.map((r, i) => `
                <tr class="hover:bg-slate-50"><td class="py-4 font-bold">${r}</td>
                <td><button onclick="deleteRecipe(${i})" class="text-red-500 hover:bg-red-50 px-3 py-1 rounded">Hapus</button></td></tr>
            `).join('');
        }

        // Fungsi Tambah Pengguna
        function addUser(e) {
            e.preventDefault();
            const users = JSON.parse(localStorage.getItem('db_users'));
            const name = document.getElementById('newUserName').value;
            users.push({ id: Date.now().toString().slice(-4), name });
            localStorage.setItem('db_users', JSON.stringify(users));
            document.getElementById('newUserName').value = '';
            renderData();
        }

        // Fungsi Tambah Resep
        function addRecipe(e) {
            e.preventDefault();
            const recipes = JSON.parse(localStorage.getItem('db_recipes'));
            recipes.push(document.getElementById('newRecipeName').value);
            localStorage.setItem('db_recipes', JSON.stringify(recipes));
            document.getElementById('newRecipeName').value = '';
            renderData();
        }

        // Fungsi Hapus
        function deleteUser(index) {
            const users = JSON.parse(localStorage.getItem('db_users'));
            users.splice(index, 1);
            localStorage.setItem('db_users', JSON.stringify(users));
            renderData();
        }
        function deleteRecipe(index) {
            const recipes = JSON.parse(localStorage.getItem('db_recipes'));
            recipes.splice(index, 1);
            localStorage.setItem('db_recipes', JSON.stringify(recipes));
            renderData();
        }

        // Panggil render saat pertama kali dimuat
        renderData();

        // --- LOGIKA UI TABS ---
        function switchTab(tabId) {
            document.querySelectorAll('.content-section').forEach(el => el.classList.add('hidden'));
            document.getElementById('content-' + tabId).classList.remove('hidden');
            document.querySelectorAll('.menu-btn').forEach(btn => {
                btn.className = "w-full text-left px-5 py-3.5 hover:bg-white/5 rounded-xl text-slate-400 hover:text-white transition font-medium menu-btn";
            });
            const active = document.getElementById('btn-' + tabId);
            active.className = "w-full text-left px-5 py-3.5 bg-utama/20 text-utama rounded-xl font-bold transition menu-btn";
            const titles = { 'dashboard': 'Ringkasan Sistem', 'pengguna': 'Database Pengguna', 'resep': 'Database Resep' };
            document.getElementById('pageTitle').innerText = titles[tabId];
        }

        function handleLogout() {
            sessionStorage.removeItem('isLoggedIn'); window.location.href = 'index.html';
        }
    </script>
</body>
</html>

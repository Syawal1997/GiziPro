<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - GiziPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { utama: '#16a34a', aksen: '#facc15', dasar: '#ffffff' } }
            }
        }
    </script>
</head>
<body class="bg-green-50 h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-md border border-green-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-utama mb-2">GiziPro <span class="text-gray-800">Login</span></h1>
            <p class="text-gray-500">Silakan masuk ke panel admin</p>
        </div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-5">
                <label class="block text-gray-700 font-bold mb-2">Username</label>
                <input type="text" id="username" class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:outline-none focus:border-utama focus:ring-1 focus:ring-utama" placeholder="Masukkan username" required>
            </div>
            <div class="mb-8">
                <label class="block text-gray-700 font-bold mb-2">Password</label>
                <input type="password" id="password" class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:outline-none focus:border-utama focus:ring-1 focus:ring-utama" placeholder="••••••••" required>
            </div>
            <button type="submit" class="w-full bg-utama text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700 transition shadow-lg">Login Masuk</button>
        </form>
        
        <!-- Pesan Error -->
        <p id="errorMessage" class="text-red-500 text-sm text-center mt-4 hidden">Username atau Password salah!</p>
        
        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm text-gray-500 hover:text-utama">← Kembali ke Halaman Utama</a>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault(); // Mencegah reload halaman
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Validasi kredensial (Syarat: syawal / syawal123)
            if (user === 'syawal' && pass === 'syawal123') {
                sessionStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'admin.html'; // Pindah ke dashboard
            } else {
                document.getElementById('errorMessage').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
